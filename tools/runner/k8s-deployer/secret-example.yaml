# Secret 示例 —— **不要把真实值入仓**
#
# 用法同 ai-dev-runner：拷贝改名加 .gitignore，或用 `kubectl create secret generic` 命令直接建。
# 凭据档位详见 ../../pipeline/generic-layer/credentials-storage.md
---
apiVersion: v1
kind: Secret
metadata:
  name: k8s-deployer-secrets
  namespace: ci-runners
type: Opaque
stringData:
  # GitHub 一次性 runner registration token
  GH_RUNNER_TOKEN: "<replace-me>"

  # 流程 3 promote 到 beta 触发 Jenkins job 用
  JENKINS_API_USER: "<replace-me>"
  JENKINS_API_TOKEN: "<replace-me>"
---
# 单独的 kubeconfig Secret —— deployment.yaml 的 volumes 段引用这个
apiVersion: v1
kind: Secret
metadata:
  name: deployer-kubeconfig
  namespace: ci-runners
type: Opaque
stringData:
  # 目标集群 admin / deployer 角色的 kubeconfig 完整内容
  config: |
    apiVersion: v1
    kind: Config
    clusters: [...]
    users: [...]
    contexts: [...]
    current-context: <target-context>
