apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-deployer
  namespace: ci-runners
---
# k8s-deployer 需要在目标 namespace 上拥有 deployment/svc/ingress 权限
# 实际生产应按目标 namespace 单独 RoleBinding（这里给的是简化示例）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-deployer
subjects:
  - kind: ServiceAccount
    name: k8s-deployer
    namespace: ci-runners
roleRef:
  kind: ClusterRole
  name: k8s-deployer
  apiGroup: rbac.authorization.k8s.io
