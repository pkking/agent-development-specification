apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deployer
  namespace: ci-runners
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-deployer
  template:
    metadata:
      labels:
        app: k8s-deployer
    spec:
      serviceAccountName: k8s-deployer
      nodeSelector:
        node-role.kubernetes.io/ci: ""
      containers:
        - name: runner
          image: <registry>/k8s-deployer:latest
          imagePullPolicy: Always
          env:
            - name: KUBECONFIG
              value: /home/deployer/.kube/config
          envFrom:
            - configMapRef:
                name: k8s-deployer-config
            - secretRef:
                name: k8s-deployer-secrets
          volumeMounts:
            - name: kubeconfig
              mountPath: /home/deployer/.kube
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f 'run.sh' > /dev/null
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /home/deployer/actions-runner/.runner && pgrep -f 'run.sh' > /dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: kubeconfig
          secret:
            secretName: deployer-kubeconfig
