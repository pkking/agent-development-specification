apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-dev-runner
  namespace: ci-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-dev-runner
  namespace: ci-runners
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-dev-runner
  namespace: ci-runners
subjects:
  - kind: ServiceAccount
    name: ai-dev-runner
    namespace: ci-runners
roleRef:
  kind: Role
  name: ai-dev-runner
  apiGroup: rbac.authorization.k8s.io
