# /workspaces 持久化卷 — 流程 2 的 per-issue 工作区 $WORKSPACE_DIR 落在这里
# 跨 job 持久化（90 min 长流程要复用 5 个 dev 仓 checkout），按「umbrella 仓 / per-issue」切目录互不打架
# 详见 ../../pipeline/architecture.md §3.5 Runner 路径约定
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-dev-runner-workspaces
  namespace: ci-runners
  labels:
    app: ai-dev-runner
spec:
  accessModes:
    - ReadWriteMany # 多个 runner pod 并发跑不同 issue 时共用同一 PVC（按 per-issue 子目录隔离）
  resources:
    requests:
      storage: 100Gi # 按 issue 数 × 5 个 dev 仓 × 仓平均大小估
  storageClassName: <your-rwx-storage-class> # 按集群实际改：cephfs / nfs / cubefs / longhorn-rwx ...
