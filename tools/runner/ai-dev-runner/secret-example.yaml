# Secret 示例 —— **不要把真实值入仓**
#
# 部署 ai-dev-runner 时，把下面这个文件拷一份到本地（命名 secret.yaml），把 <...> 填上真实值，
# 然后 `kubectl apply -f secret.yaml`，并把 secret.yaml 加进 .gitignore。
#
# 更推荐做法：用 kubectl create 命令直接建 secret（避免文件落盘），见
# ../../src/runner/ai-dev-runner/README.md「部署步骤」第 3 步。
#
# 凭据来源与档位详见 ../../pipeline/generic-layer/credentials-storage.md
apiVersion: v1
kind: Secret
metadata:
  name: ai-dev-runner-secrets
  namespace: ci-runners
type: Opaque
stringData:
  # GitHub 一次性 runner registration token（Settings → Actions → Runners → New self-hosted runner）
  GH_RUNNER_TOKEN: "<replace-me>"

  # LLM CLI（按所装的 CLI 二选一即可；同时设也不冲突）
  ANTHROPIC_API_KEY: "<replace-me>"
  OPENCODE_API_KEY:  "<replace-me>"

  # 跨仓操作（clone backlog / push 需求 PR / merge dev 仓 PR）
  BACKLOG_REPO_TOKEN: "<replace-me>"
  CROSS_REPO_TOKEN:   "<replace-me>"

  # deploy.py 起 / 清预览资源时用
  AI_TEST_KUBECONFIG: "<base64-encoded-kubeconfig>"

  # 仅 APIMagic per-PR 模式建 PG 表用
  LOCAL_DB_PASSWORD: "<replace-me>"
