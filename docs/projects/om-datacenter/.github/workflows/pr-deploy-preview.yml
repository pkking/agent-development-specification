name: 🚢 PR 预览部署（独立 / Runner B / deployer）

# 通用的「按 (仓库, PR) 起预览」入口，与具体服务解耦：
#   - 人工直接提的 PR：各 dev 仓放一个 caller workflow（模板见 docs/external-workflows/pr-deploy-caller.template.yml）
#     在 pull_request 时 repository_dispatch 到本仓的本 workflow
#   - 也可 workflow_dispatch 手动触发 / cleanup
#   - Workflow B（Runner A）不走这里——它直接调 src/deployer/deploy.py（同一个脚本，结果一致）
#
# 跑在新的 self-hosted runner（label k8s-deployer，部署见 deploy/runners/）上，凭据当前复用 Runner A 的那批。
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'dev 仓 owner/name，如 opensourceways/datastat-manage-website'
        required: true
      pr:
        description: 'PR 号'
        required: true
      action:
        description: 'deploy / cleanup / status'
        required: false
        default: deploy
  repository_dispatch:
    types: [pr_deploy, pr_deploy_cleanup]

concurrency:
  group: pr-deploy-${{ github.event.inputs.repo || github.event.client_payload.repo }}-${{ github.event.inputs.pr || github.event.client_payload.pr }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, k8s-deployer]
    timeout-minutes: 25
    env:
      TARGET_REPO: ${{ github.event.inputs.repo || github.event.client_payload.repo }}
      TARGET_PR: ${{ github.event.inputs.pr || github.event.client_payload.pr }}
      ACTION: ${{ github.event.inputs.action || github.event.client_payload.action || (github.event.action == 'pr_deploy_cleanup' && 'cleanup') || 'deploy' }}
    steps:
      - name: Checkout om-datacenter (含 src/deployer)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Run deployer
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKLOG_REPO_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}
          KCFG_B64: ${{ secrets.AI_TEST_KUBECONFIG }}
        run: |
          [ -z "$TARGET_REPO" ] || [ -z "$TARGET_PR" ] && { echo "::error::缺 repo / pr 输入"; exit 1; }
          if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
            unset KUBECONFIG   # runner 在 k8s 里：用 in-cluster config (pod SA)
          else
            echo "$KCFG_B64" | base64 -d > /tmp/kubeconfig && export KUBECONFIG=/tmp/kubeconfig
          fi
          python3 src/deployer/deploy.py "$ACTION" --repo "$TARGET_REPO" --pr "$TARGET_PR" --result-file /tmp/dr.json || echo "::warning::deployer $ACTION 非 0"
          rm -f /tmp/kubeconfig

      - name: Comment back on PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKLOG_REPO_TOKEN || secrets.CROSS_REPO_TOKEN || github.token }}
        run: |
          [ ! -s /tmp/dr.json ] && { echo "(无结果文件，跳过评论)"; exit 0; }
          python3 - <<'PY' > /tmp/prbody.md
          import json
          d = json.load(open('/tmp/dr.json'))
          rep = d.get('report') or ''
          url = d.get('preview_url') or ''
          ready = d.get('ready')
          head = "## 🚢 预览部署"
          if url and ready == 'true':
              head += f"\n\n**预览地址：{url}**"
          print(head + ("\n\n" + rep if rep else ""))
          PY
          gh pr comment "$TARGET_PR" --repo "$TARGET_REPO" --body-file /tmp/prbody.md || echo "::warning::PR 评论失败"
