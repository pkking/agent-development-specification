name: go-build-and-coverage-reusable

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner to use for the job'
        required: true
        type: string
        default: 'ubuntu-latest'
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.22'
      test-packages:
        description: 'Go packages to test (space-separated)'
        required: false
        type: string
        default: './...'
    secrets:
      gh-token:
        description: 'GitHub token for accessing private repositories'
        required: false

permissions:
  contents: read

env:
  GOPRIVATE: github.com/opensourceways/*
  GONOSUMDB: github.com/opensourceways/*
  GOPROXY: https://goproxy.cn,direct
  # Coverage thresholds (defined at organization level, not configurable per project)
  FULL_COVERAGE_THRESHOLD: 10.0
  INC_COVERAGE_THRESHOLD: 80.0
  TEST_PACKAGES: ${{ inputs.test-packages }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    container:
      image: golang:${{ inputs.go-version }}-bookworm
    steps:
    - name: Checkout (full history for incremental coverage)
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Configure git with secure token handling
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.gh-token }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory '*'
        
        # Secure token handling: use temporary .netrc file with strict permissions
        # This avoids writing tokens to persistent git config files
        if [ -n "${GH_TOKEN:-}" ]; then
          NETRC_FILE="${HOME}/.netrc"
          # Create .netrc with token for github.com
          echo "machine github.com login x-access-token password ${GH_TOKEN}" > "${NETRC_FILE}"
          # Set strict permissions (only owner can read)
          chmod 600 "${NETRC_FILE}"
          # Configure git to use .netrc for authentication
          git config --global credential.helper 'store --file ~/.netrc'
        fi

    - name: Cache Go modules and build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        go build -v ./...

    - name: Coverage Check
      shell: bash
      run: |
        set -euo pipefail
        chmod +x scripts/go_coverage_check.sh
        ./scripts/go_coverage_check.sh

    - name: Cleanup credentials
      shell: bash
      if: always()
      run: |
        # Always clean up credential files to prevent token leakage
        rm -f "${HOME}/.netrc" 2>/dev/null || true
        git config --global --unset credential.helper 2>/dev/null || true